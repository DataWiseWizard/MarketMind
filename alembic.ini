[alembic]
# Path to migration scripts
script_location = alembic

# Prepend project root to sys.path so imports work
prepend_sys_path = .

# Default DB URL — overridden at runtime by alembic/env.py from .env
sqlalchemy.url = postgresql://postgres:password@localhost:5432/marketmind_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
